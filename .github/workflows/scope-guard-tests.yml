name: Scope Guard Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run local tests
        working-directory: skillcompass-gate6-vercel
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/.github/scripts/block-test-network.cjs
        run: node --test lib/scopeGuard.test.js lib/lessonContent.test.js api/ai-teacher.test.js api/ai-teacher.realstream.test.js
